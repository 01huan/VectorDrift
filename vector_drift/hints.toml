# Hints for every FIXED level in data.LEVELS. Random levels (7, 8) use the AI Solver instead.
# Each level: `steps` are shown one at a time; the last page shows `answer_note`
# plus every entry of `answers` (each one can be applied to the Fx / Fy editor).
# A multi-section level instead has one hint per section, [level.N.section.K] with
# K = 1 .. its number of sections; it cannot also have the plain keys above.
# tests/test_hints.py checks that every answer actually reaches the target
# (for a section: that section's target, flown from that section's start).

[level.1]
steps = [
  "The planet is straight to your right, on the same line as the ship (y = 0). The ship starts at rest, so it moves the way the force pushes it.",
  "Push only to the right: make Fx positive and keep Fy = 0. A constant force gives constant acceleration (F = ma).",
]
answer_note = "Any positive Fx works, as long as it is not too small to arrive in time."
answers = [
  { fx = "5", fy = "0" },
]

[level.2]
steps = [
  "A rock blocks the middle. Pushing straight right, like in Level 1, crashes into it. You need a curved path.",
  "Try a swirl: F = (-y, x) always pushes sideways, turning the ship around the point (0, 0).",
  "The swirl only pushes sideways and never pulls inward, so inertia carries the ship outward: it spirals, getting wider. Centered at (0, 0), the ship starts 7 m away and the force is too strong, so it gets flung out.",
  "Move the swirl center: replace x with (x - h) to center it at (h, 0). Put the center just to the right of the ship, so the spiral starts small and opens up around the rock.",
]
answer_note = "A swirl centered at (-6, 0)."
answers = [
  { fx = "-y", fy = "x + 6" },
]

[level.3]
steps = [
  "The planet is sealed by a ring of rocks. Grab a Shockwave first: it blasts nearby rocks and opens a gap.",
  "Plan the route: go up to the top Shockwave first, then come down to the planet. So Fy should push up on the left and down on the right. Fy = -x does exactly that, and a constant Fx moves you right.",
  "But F = (3, -x) climbs too fast and flies off the top. Add -2y to pull the ship back down as it climbs.",
  "Together, Fy = -x - 2y works like a spring pulling the ship toward the slanted line y = -x/2: high on the left, low on the right.",
]
answer_note = "Two mirrored routes:"
answers = [
  { label = "Top Shockwave", fx = "3", fy = "-x - 2y" },
  { label = "Bottom Shockwave", fx = "3", fy = "x - 2y" },
]

[level.4]
steps = [
  "A wall of rocks seals x = 0 from top to bottom. There is no way around it; the only way through is the wormhole. Its black hole sits at (-3, 4), far above the ship's starting height (y = 0).",
  "Use the spring from Level 3: Fy = -k(y - line) pulls the ship toward a line. Make the line slope down as x grows, so it is high on the left, for example y = 0.5 - x/4. Push right with a steady Fx = 2.",
  "The ship starts about 2 m below that line, so it swings roughly as far above it. The spring strength k does not change how high it swings, only where it peaks: a stiffer spring peaks sooner. Pick k so the peak lands near the black hole (x = -3).",
  "The same field keeps working after the teleport. At the white hole (2, 4) the line has dropped to y = 0, well below the ship, so the same spring pulls it back down into the target.",
]
answer_note = "A spring toward the line y = 0.5 - x/4, with a steady push to the right. Pushing harder needs a stiffer spring:"
answers = [
  { label = "Fx = 2, k = 2", fx = "2", fy = "1 - 0.5x - 2y" },
  { label = "Fx = 3, k = 3", fx = "3", fy = "1.5 - 0.75x - 3y" },
]

[level.5]
steps = [
  "Pushing straight right hits the first rock. Use the swirl from Level 2: F = (-y, x - h) turns the ship around the point (h, 0). Put the center just right of the ship and the spiral swings down, passes under both rocks, and curls back up into the planet.",
  "The center decides where the spiral comes back to y = 0 on the right. Here it has to sit about 1.3 m right of the ship, near (-6.7, 0). But a round swirl centered there loops about 4.8 m high and crashes into the rows of rocks above and below.",
  "The two coefficients do not have to match. In F = (-a y, b (x - h)), the left-right motion stays exactly the same, but every height is multiplied by the square root of b/a. A bigger a squashes the round spiral into a flat ellipse.",
  "Keep Fy = x + 6.7 and double the y term: Fx = -2y. Now a/b = 2, so the loop is 1/sqrt(2), about 0.7 times as tall: it peaks near 3.4 m, slips between the rock rows, and still lands on the planet.",
]
answer_note = "A swirl centered at (-6.7, 0), flattened by a bigger y term. Flip both signs to go over the top instead:"
answers = [
  { label = "Flat ellipse, under the rocks", fx = "-2y", fy = "x + 6.7" },
  { label = "Flat ellipse, over the rocks", fx = "2y", fy = "-x - 6.7" },
]
